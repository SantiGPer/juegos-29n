<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba: M1 ordenar</title>
</head>
<body>
<!-- Juega partidas de A2 con el motor real y comprueba que, al comprobar, la lista resuelta conserva
     el orden del jugador y que solo los hitos mal colocados llevan «Era el N.º», con su posición por fecha. Resultado en el título y en <pre>.
     Uso: servir la raíz del repo y abrir /pruebas/ordenar.html (o chrome --headless --dump-dom). -->
<main hidden></main>
<pre id="log"></pre>
<script type="module">
import { iniciar } from '../shared/motores/quiz.js';

const datos = await fetch('../juegos/a02-cronologia-legislatura/data.json').then(r => r.json());
const main = document.querySelector('main');
window.scrollTo = () => {};

const partida = () => {
  iniciar(datos, main);
  main.querySelector('.accion').click();
  return datos.rondas.map((r, n) => {
    const jugador = [...main.querySelectorAll('.orden li > span')].map(s => s.textContent);
    main.querySelector('.accion').click();
    const filas = [...main.querySelectorAll('.orden.resuelta li')];
    const resuelta = filas.map(li => li.querySelector('.hito').textContent);
    const porFecha = [...r.hitos].sort((a, b) => a.fecha.localeCompare(b.fecha)).map(h => h.texto);
    // Sin «Era el», el hito está en su sitio; con él, está fuera y la cifra es su posición por fecha
    const era = filas.map((li, i) => +(li.textContent.match(/Era el (\d+)\.º/)?.[1] ?? i + 1));
    const anotadas = filas.map(li => /Era el/.test(li.textContent));
    main.querySelector('.accion').click();
    if (resuelta.join('|') !== jugador.join('|')) return `ronda ${n + 1}: la lista resuelta no conserva el orden del jugador`;
    if (era.some((p, i) => porFecha[p - 1] !== resuelta[i])) return `ronda ${n + 1}: «Era el» no coincide con la fecha (${era.join(' ')})`;
    if (anotadas.some((a, i) => a === (porFecha[i] === resuelta[i]))) return `ronda ${n + 1}: «Era el» en un hito bien colocado o falta en uno mal colocado`;
    return null;
  }).filter(Boolean);
};

const fallos = Array.from({ length: 100 }, partida).flat();
document.querySelector('#log').textContent = fallos.length ? fallos.join('\n') : '100 partidas: listas resueltas en el orden del jugador y posiciones reales correctas';
document.title = fallos.length ? 'FALLO' : 'OK';
</script>
</body>
</html>
